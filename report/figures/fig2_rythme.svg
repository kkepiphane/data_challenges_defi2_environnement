<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="100%" role="img" aria-label="L'objectif 2030 demande dix fois le rythme actuel"><rect width="760" height="210" fill="none"/><text x="0" y="17" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0C4F2B">L'objectif 2030 demande dix fois le rythme actuel</text><text x="0" y="35" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6B7A8D">Accès rural à l'électricité · au rythme observé, l'accès universel tomberait en 2104</text><rect x="210" y="58" width="38.9" height="26" rx="4" fill="#94A3B8"/><text x="198.0" y="76.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#152238" text-anchor="end">Rythme observé 1998–2022</text><text x="258.9" y="76.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#94A3B8" text-anchor="start">+0,91 point/an</text><rect x="210" y="104" width="400.0" height="26" rx="4" fill="#C0392B"/><text x="198.0" y="122.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#152238" text-anchor="end">Rythme requis pour l'accès universel en 2030</text><text x="620.0" y="122.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="start">+9,38 point/an</text><rect x="210" y="164" width="420" height="30" rx="6" fill="#C0392B" opacity=".07"/><text x="224.0" y="184.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#C0392B" text-anchor="start">soit un effort à multiplier par 10</text><text x="198.0" y="184.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#152238" text-anchor="end">Écart à combler</text></svg>