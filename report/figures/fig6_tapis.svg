<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Le taux monte, le nombre de personnes privées d'électricité aussi"><rect width="760" height="330" fill="none"/><text x="0" y="17" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5533">Le taux monte, le nombre de personnes privées d'électricité aussi</text><text x="0" y="35" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" fill="#5D6E64">Ruraux sans électricité, 1998–2022 · décomposition exacte, sans hypothèse</text><line x1="62" y1="256.0" x2="740" y2="256.0" stroke="#D5DED8"/><text x="54.0" y="260.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5D6E64" text-anchor="end">0 M</text><line x1="62" y1="220.7" x2="740" y2="220.7" stroke="#D5DED8"/><text x="54.0" y="224.7" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5D6E64" text-anchor="end">1 M</text><line x1="62" y1="185.4" x2="740" y2="185.4" stroke="#D5DED8"/><text x="54.0" y="189.4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5D6E64" text-anchor="end">2 M</text><line x1="62" y1="150.1" x2="740" y2="150.1" stroke="#D5DED8"/><text x="54.0" y="154.1" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5D6E64" text-anchor="end">3 M</text><line x1="62" y1="114.7" x2="740" y2="114.7" stroke="#D5DED8"/><text x="54.0" y="118.7" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5D6E64" text-anchor="end">4 M</text><line x1="62" y1="79.4" x2="740" y2="79.4" stroke="#D5DED8"/><text x="54.0" y="83.4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5D6E64" text-anchor="end">5 M</text><rect x="80.0" y="146.0" width="118" height="110.0" rx="3" fill="#85938B"/><text x="139.0" y="137.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#85938B" text-anchor="middle">3,11 M</text><text x="139.0" y="276.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#0C1A14" text-anchor="middle">1998</text><rect x="238.0" y="86.2" width="118" height="59.8" rx="3" fill="#B32418"/><text x="297.0" y="77.2" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#B32418" text-anchor="middle">+1,69 M</text><text x="297.0" y="276.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#0C1A14" text-anchor="middle">Croissance de la</text><text x="297.0" y="290.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#0C1A14" text-anchor="middle">population rurale</text><line x1="198.0" y1="146.0" x2="238.0" y2="146.0" stroke="#5D6E64" stroke-width="1" stroke-dasharray="3 3"/><rect x="396.0" y="86.2" width="118" height="38.4" rx="3" fill="#0F7A4A"/><text x="455.0" y="77.2" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0F7A4A" text-anchor="middle">−1,09 M</text><text x="455.0" y="276.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#0C1A14" text-anchor="middle">Effet de</text><text x="455.0" y="290.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#0C1A14" text-anchor="middle">l'électrification</text><line x1="356.0" y1="86.2" x2="396.0" y2="86.2" stroke="#5D6E64" stroke-width="1" stroke-dasharray="3 3"/><rect x="554.0" y="124.6" width="118" height="131.4" rx="3" fill="#0C1A14"/><text x="613.0" y="115.6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0C1A14" text-anchor="middle">3,72 M</text><text x="613.0" y="276.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#0C1A14" text-anchor="middle">2022</text><line x1="514.0" y1="124.6" x2="554.0" y2="124.6" stroke="#5D6E64" stroke-width="1" stroke-dasharray="3 3"/><text x="62.0" y="318.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#5D6E64" text-anchor="start">Le taux d'accès rural passe pourtant de 3,1 % à 25 % sur la même période. L'électrification n'annule que 64 % de la poussée démographique.</text></svg>