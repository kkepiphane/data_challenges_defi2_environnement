<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" role="img" aria-label="Ce que chaque levier touche réellement"><rect width="760" height="240" fill="none"/><text x="0" y="17" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5533">Ce que chaque levier touche réellement</text><text x="0" y="35" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" fill="#5D6E64">Population directement concernée · population totale 9,1 M</text><rect x="236" y="62" width="366.7" height="30" rx="4" fill="#B32418"/><text x="224.0" y="82.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#0C1A14" text-anchor="end">Cuisson propre</text><text x="612.7" y="82.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#B32418" text-anchor="start">8,1 millions de personnes</text><rect x="236" y="114" width="168.6" height="30" rx="4" fill="#B87407"/><text x="224.0" y="134.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#0C1A14" text-anchor="end">Électrification rurale décentralisée</text><text x="414.6" y="134.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#B87407" text-anchor="start">3,7 millions de personnes</text><rect x="236" y="170" width="494" height="30" rx="4" fill="#0F7A4A" opacity=".10"/><text x="224.0" y="190.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#0C1A14" text-anchor="end">Protection ciblée des forêts</text><text x="248.0" y="190.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#0A5533" text-anchor="start">9 massifs prioritaires · 91 468 ha — ne se compte pas en personnes</text><text x="224.0" y="228.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#5D6E64" text-anchor="end">La cuisson propre concerne 2.2 fois plus de Togolais que l'électrification — et agit aussi sur la forêt, la santé et le climat.</text></svg>