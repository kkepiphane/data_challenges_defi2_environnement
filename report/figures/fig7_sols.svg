<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-label="Ce qui prend la place de la forêt se mesure, et ce n'est pas le bois de feu"><rect width="760" height="300" fill="none"/><text x="0" y="17" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5533">Ce qui prend la place de la forêt se mesure, et ce n'est pas le bois de feu</text><text x="0" y="35" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" fill="#5D6E64">Togo, 1990–2013 · comparaison arrêtée à 2013, la surface agricole étant gelée depuis 2013</text><rect x="250" y="74" width="348.2" height="32" rx="4" fill="#B87407"/><text x="238.0" y="96.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0C1A14" text-anchor="end">Surface agricole gagnée</text><text x="608.2" y="96.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#B87407" text-anchor="start">+6 600 km²</text><rect x="250" y="128" width="69.5" height="32" rx="4" fill="#0F7A4A"/><text x="238.0" y="150.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0C1A14" text-anchor="end">Couvert forestier perdu</text><text x="329.5" y="150.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F7A4A" text-anchor="start">−1 317 km²</text><rect x="250" y="192" width="500" height="34" rx="6" fill="#B87407" opacity=".08"/><text x="264.0" y="214.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#B87407" text-anchor="start">l'agricole gagne 5.0 fois ce que la forêt perd — la forêt ne peut fournir que 20 % de cette expansion</text><text x="238.0" y="214.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0C1A14" text-anchor="end">Rapport des deux</text><text x="238.0" y="248.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0C1A14" text-anchor="end">Chaque année</text><text x="250.0" y="248.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#B32418" text-anchor="start">19 690 ha de terres nouvelles mises en culture, contre 2 960 ha de forêt perdus</text><text x="250.0" y="268.0" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#5D6E64" text-anchor="start">soit un rapport de 6.7 pour 1 · rendement céréalier 1,17 t/ha, 46 % de la hausse de production venant de la surface</text></svg>