[theme]
# Theme clair force : le tableau de bord est concu sur fond clair (cartes
# blanches, plotly_white). Sans ce fichier, Streamlit suit le reglage du
# systeme et bascule en sombre.
#
# Les valeurs viennent de app/palette.py, source unique des couleurs du
# projet : ce sont elles qui teintent les widgets (curseurs, cases, onglets),
# que la feuille de style ne peut pas toujours atteindre. Les laisser diverger
# ferait cohabiter deux verts dans la meme page.
base = "light"
primaryColor = "#0F7A4A"              # vert foret — accent des widgets
backgroundColor = "#EFF2F0"          # fond de page
secondaryBackgroundColor = "#FFFFFF"  # fond des widgets et des blocs
textColor = "#0C1A14"                 # encre
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
runOnSave = true
